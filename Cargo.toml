[package]
name = "dandelion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bson = "3.1.0"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
directories = "6.0.0"
humantime = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
httpmock = "0.9.0"
tempfile = "3.27.0"
